<div ref="{{ root }}" data-theme="{{ theme }}" style="background:var(--bg); color:var(--ink); min-height:100vh; display:flex; flex-direction:column">
  <dc-import name="Sidehode" hjem="Forside.dc.html" style="position:sticky; top:0; z-index:40" hint-size="100%,65px"></dc-import>
  <main data-screen-label="404" style="flex:1; padding-block:clamp(48px,8vw,120px)">
    <div style="{{ grid }}">
      <div style="display:grid; gap:20px; align-content:center; min-width:0">
        <span class="eyebrow">404</span>
        <h1 style="font-size:var(--t-hero); line-height:1.02">Dette rommet finnes ikke</h1>
        <p class="lede">Siden finnes ikke.</p>
        <div style="display:flex">
          <x-import component-from-global-scope="HengselDesignSystem_5a9d09.Button" variant="primary" href="Forside.dc.html" hint-size="140px,44px">Til forsiden</x-import>
        </div>
      </div>
      <dc-import name="Plantegning Entre" mangler="{{ true }}" style="width:100%; max-width:520px; justify-self:end" hint-size="100%,420px"></dc-import>
    </div>
  </main>
  <dc-import name="Bunn" hjem="Forside.dc.html" demo="{{ false }}" hint-size="100%,180px"></dc-import>

<script type="text/x-dc" data-dc-script data-props="{&quot;tema&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;system&quot;,&quot;lys&quot;,&quot;mørk&quot;],&quot;default&quot;:&quot;system&quot;,&quot;tsType&quot;:&quot;'system'|'lys'|'mørk'&quot;}}">
class Component extends DCLogic {
  state = { w: 1440, sysDark: false };
  root = React.createRef();
  componentDidMount() {
    const el = this.root.current;
    if (el) { const m = () => { const w = el.clientWidth; if (w && w !== this.state.w) this.setState({ w }); }; this.ro = new ResizeObserver(m); this.ro.observe(el); m(); }
    this.mq = matchMedia('(prefers-color-scheme: dark)');
    this.mqh = () => this.setState({ sysDark: this.mq.matches });
    this.mq.addEventListener('change', this.mqh); this.mqh();
  }
  componentDidUpdate() { document.documentElement.setAttribute('data-theme', this.isDark() ? 'dark' : 'light'); }
  componentWillUnmount() { this.ro && this.ro.disconnect(); this.mq && this.mq.removeEventListener('change', this.mqh); }
  isDark() {
    const q = new URLSearchParams(location.search).get('tema');
    const t = q === 'mork' || q === 'mørk' ? 'mørk' : q === 'lys' ? 'lys' : (this.props.tema ?? 'system');
    return t === 'mørk' ? true : t === 'lys' ? false : this.state.sysDark;
  }
  renderVals() {
    const mob = this.state.w < 860;
    return {
      root: this.root, theme: this.isDark() ? 'dark' : 'light',
      grid: { maxWidth: 1180, margin: '0 auto', paddingInline: 'clamp(16px,4vw,40px)', display: 'grid', gridTemplateColumns: mob ? 'minmax(0,1fr)' : 'minmax(0,1fr) minmax(0,1fr)', gap: 'clamp(32px,5vw,72px)', alignItems: 'center' },
    };
  }
}
</script>
</body>
