<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/hengsel-design-system-5a9d09c6-be10-4ae1-a516-a0a32d786c17/tokens/colors.css">
  <link rel="stylesheet" href="_ds/hengsel-design-system-5a9d09c6-be10-4ae1-a516-a0a32d786c17/tokens/typography.css">
  <link rel="stylesheet" href="_ds/hengsel-design-system-5a9d09c6-be10-4ae1-a516-a0a32d786c17/tokens/base.css">
</helmet>
<div style="background:var(--bg); color:var(--ink)">
  <div style="border-top:1px solid var(--line)">
    <div style="max-width:1180px; margin:0 auto; padding:28px clamp(16px,4vw,40px); display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px 32px">
      <a href="https://sngroup.no" style="display:flex; align-items:center; gap:12px; color:var(--ink); text-decoration:none; font-size:.95rem">
        <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" style="flex:none; display:block">
          <rect width="32" height="32" rx="7" fill="var(--ink)"></rect>
          <path d="M8 8h16v16H8z" fill="none" stroke="var(--bg)" stroke-width="2.5"></path>
          <path d="M16 8v8h8" fill="none" stroke="var(--bg)" stroke-width="1.5"></path>
          <circle cx="8" cy="24" r="2" fill="var(--dusty-blue)"></circle>
        </svg>
        <span>En del av SN Group</span>
      </a>
      <nav aria-label="Søstersider" style="display:flex; flex-wrap:wrap; gap:6px 10px; font-size:.95rem; color:var(--muted)">
        <a href="https://sngroup.no" style="color:var(--muted)" style-hover="color:var(--ink)">sngroup.no</a>
        <span aria-hidden="true">·</span>
        <span aria-current="page" style="color:var(--ink)">hengsel.no</span>
        <span aria-hidden="true">·</span>
        <a href="https://byggem.no" style="color:var(--muted)" style-hover="color:var(--ink)">byggem.no</a>
      </nav>
    </div>
  </div>
  <footer style="border-top:1px solid var(--line); font-size:.9rem; color:var(--muted)">
    <div style="max-width:1180px; margin:0 auto; padding:32px clamp(16px,4vw,40px) 40px; display:flex; flex-wrap:wrap; gap:12px 28px; justify-content:space-between">
      <span>Hengsel · ES-HOLDING AS · org.nr. 927 363 585 · <a href="mailto:drift@sngroup.no" style="color:inherit">drift@sngroup.no</a></span>
      <sc-if value="{{ demo }}" hint-placeholder-val="{{ true }}">
        <span>Skjermbildene viser demodata. Navn og tall er ikke ekte.</span>
      </sc-if>
      <span style="display:flex; gap:8px"><a href="{{ personvern }}" style="color:inherit">Personvern</a><span aria-hidden="true">·</span><a href="{{ topp }}" style="color:inherit">{{ toppTekst }}</a></span>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:200},&quot;hjem&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;demo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;personvern&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Personvern.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const h = this.props.hjem ?? '';
    return {
      demo: this.props.demo ?? true,
      personvern: this.props.personvern ?? 'Personvern.dc.html',
      topp: h ? h : '#hjem',
      toppTekst: h ? 'Til forsiden' : 'Til toppen',
    };
  }
}
</script>
</body>
</html>
