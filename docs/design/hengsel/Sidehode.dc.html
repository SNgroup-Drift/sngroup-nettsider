<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/hengsel-design-system-5a9d09c6-be10-4ae1-a516-a0a32d786c17/tokens/colors.css">
  <link rel="stylesheet" href="_ds/hengsel-design-system-5a9d09c6-be10-4ae1-a516-a0a32d786c17/tokens/typography.css">
  <link rel="stylesheet" href="_ds/hengsel-design-system-5a9d09c6-be10-4ae1-a516-a0a32d786c17/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/hengsel-design-system-5a9d09c6-be10-4ae1-a516-a0a32d786c17/tokens/base.css">
  <link rel="stylesheet" href="_ds/hengsel-design-system-5a9d09c6-be10-4ae1-a516-a0a32d786c17/tokens/components.css">
  <script src="_ds/hengsel-design-system-5a9d09c6-be10-4ae1-a516-a0a32d786c17/_ds_bundle.js"></script>
</helmet>
<header ref="{{ root }}" style="background:var(--bg); border-bottom:1px solid var(--line)">
  <div style="max-width:1180px; margin:0 auto; padding-inline:clamp(16px,4vw,40px); height:64px; display:flex; align-items:center; gap:24px">
    <x-import component-from-global-scope="HengselDesignSystem_5a9d09.Brand" size="{{ brandSize }}" href="{{ hrefTop }}" hint-size="140px,28px"></x-import>
    <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="Hovedmeny" style="display:flex; gap:24px; margin-left:auto; font-size:.95rem">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
          <a href="{{ l.href }}" style="color:var(--muted); text-decoration:none" style-hover="color:var(--ink); text-decoration:none">{{ l.label }}</a>
        </sc-for>
      </nav>
    </sc-if>
    <div style="{{ btnWrap }}">
      <x-import component-from-global-scope="HengselDesignSystem_5a9d09.Button" variant="primary" href="{{ hrefKontakt }}" hint-size="120px,44px">Be om demo</x-import>
    </div>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:80},&quot;hjem&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: 1440 };
  root = React.createRef();
  componentDidMount() {
    const el = this.root.current; if (!el) return;
    const m = () => { const w = el.clientWidth; if (w && w !== this.state.w) this.setState({ w }); };
    this.ro = new ResizeObserver(m); this.ro.observe(el); m();
  }
  componentWillUnmount() { this.ro && this.ro.disconnect(); }
  renderVals() {
    const h = this.props.hjem ?? '';
    const wide = this.state.w > 900;
    return {
      root: this.root, wide,
      brandSize: wide ? 28 : 24,
      hrefTop: h ? h : '#hjem',
      hrefKontakt: h + '#kontakt',
      btnWrap: { marginLeft: wide ? 0 : 'auto' },
      links: this.props.lenker || [
        { label: 'Se løsningen', href: h + '#losningen' },
        { label: 'Montørappen', href: h + '#hengsel' },
        { label: 'Kundereisen', href: h + '#reisen' },
        { label: 'Spørsmål', href: h + '#sporsmal' },
      ],
    };
  }
}
</script>
</body>
</html>
