<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="design_doc_mode" content="canvas">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap">
  <style>
    body { margin: 0; background: #E4D4C4; font-family: "Inter", Arial, sans-serif; color: #31261D; }
    a { color: #5074A9; }
    a:hover { color: #31261D; }
  </style>
</helmet>
<section style="padding:48px; display:grid; gap:24px">
  <h1 style="margin:0; font:600 22px/1.2 Inter, sans-serif">hengsel.no · PC 1440 og mobil 390 · lys og mørk</h1>
  <sc-for list="{{ rows }}" as="r" hint-placeholder-count="3">
    <div style="display:grid; gap:12px">
      <h2 style="margin:0; font:600 16px/1.2 Inter, sans-serif">{{ r.title }}</h2>
      <div style="display:flex; gap:32px; align-items:flex-start">
        <sc-for list="{{ r.views }}" as="v" hint-placeholder-count="4">
          <div style="display:grid; gap:8px">
            <span style="font-size:13px; color:#5E564C">{{ v.label }}</span>
            <iframe src="{{ v.src }}" title="{{ v.label }}" style="{{ v.style }}"></iframe>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const views = (file, h) => [
      ['PC 1440 · lys', 1440, 'lys'], ['PC 1440 · mørk', 1440, 'mork'], ['Mobil 390 · lys', 390, 'lys'], ['Mobil 390 · mørk', 390, 'mork'],
    ].map(([label, w, t]) => ({ label, src: file + '?tema=' + t, style: { width: w, height: w > 400 ? h : 844, border: '1px solid #C3B5A7', borderRadius: 10, background: '#FBF9F6', display: 'block' } }));
    return {
      rows: [
        { title: 'Forside', views: views('Forside.dc.html', 1000) },
        { title: '/personvern', views: views('Personvern.dc.html', 1000) },
        { title: '404', views: views('404.dc.html', 800) },
      ],
    };
  }
}
</script>
</body>
</html>
