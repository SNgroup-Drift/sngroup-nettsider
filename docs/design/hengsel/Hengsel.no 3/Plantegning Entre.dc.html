<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/hengsel-design-system-5a9d09c6-be10-4ae1-a516-a0a32d786c17/tokens/colors.css">
  <link rel="stylesheet" href="_ds/hengsel-design-system-5a9d09c6-be10-4ae1-a516-a0a32d786c17/tokens/typography.css">
  <link rel="stylesheet" href="_ds/hengsel-design-system-5a9d09c6-be10-4ae1-a516-a0a32d786c17/tokens/base.css">
</helmet>
<figure style="margin:0; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px; color:var(--ink)">
  <div aria-hidden="true" style="display:flex; justify-content:space-between; gap:12px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums">
    <span>Plantegning · 1:50</span>
    <span>{{ koord }}</span>
  </div>
  <svg ref="{{ svg }}" onPointerMove="{{ move }}" viewBox="0 0 360 300" role="img" aria-label="{{ aria }}" style="display:block; width:100%; height:auto; margin-top:6px">
    <path d="M40 14 H320 M40 9 V19 M320 9 V19" fill="none" stroke="var(--muted)" stroke-width="1"></path>
    <text x="180" y="10" text-anchor="middle" fill="var(--muted)" style="font:500 10px var(--f-body)">2 800</text>
    <path d="M336 30 V270 M331 30 H341 M331 270 H341" fill="none" stroke="var(--muted)" stroke-width="1"></path>
    <text x="348" y="150" text-anchor="middle" transform="rotate(90 348 150)" fill="var(--muted)" style="font:500 10px var(--f-body)">2 400</text>
    <sc-if value="{{ inventar }}" hint-placeholder-val="{{ true }}">
      <g fill="none" stroke="var(--ink)" stroke-width="1" opacity=".75">
        <rect x="52" y="42" width="140" height="60" rx="2"></rect>
        <path d="M122 42 V102"></path>
        <path d="M58 72 H186" stroke-dasharray="4 3"></path>
        <rect x="272" y="60" width="36" height="120" rx="2"></rect>
        <rect x="212" y="218" width="60" height="40" rx="2"></rect>
      </g>
    </sc-if>
    <text x="64" y="176" fill="{{ romFarge }}" style="font:500 10px var(--f-body); letter-spacing:.12em">{{ rom }}</text>
    <text x="64" y="190" fill="var(--muted)" style="font:400 10px var(--f-body)">{{ merke }}</text>
    <path d="M200 270 H40 V30 H320 V270 H280" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="square" stroke-dasharray="{{ dash }}"></path>
    <path d="M200 190 A80 80 0 0 1 280 270" fill="none" stroke="var(--ink)" stroke-width=".8" stroke-dasharray="3 3"></path>
    <line x1="200" y1="270" x2="200" y2="190" stroke="var(--ink)" stroke-width="1.5"></line>
    <circle cx="200" cy="270" r="3" fill="var(--accent)"></circle>
  </svg>
</figure>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:440},&quot;mangler&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { koord: 'x 0 · y 0 mm' };
  svg = React.createRef();
  renderVals() {
    const tom = !!this.props.mangler;
    const fmt = (n) => n.toLocaleString('nb-NO');
    return {
      svg: this.svg,
      koord: this.state.koord,
      inventar: !tom,
      dash: tom ? '6 5' : 'none',
      rom: tom ? '404' : 'ENTRÉ',
      merke: tom ? 'Finnes ikke' : 'Hengsel',
      romFarge: tom ? 'var(--accent)' : 'var(--ink)',
      aria: tom ? 'Plantegning av et rom som ikke finnes' : 'Plantegning av en entré, 2 800 × 2 400 mm, med døra på et hengsel',
      move: (e) => {
        const svg = this.svg.current; const ctm = svg && svg.getScreenCTM(); if (!ctm) return;
        const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(ctm.inverse());
        const k = (v, max) => Math.min(max, Math.max(0, Math.round(v / 10) * 10));
        this.setState({ koord: 'x ' + fmt(k((p.x - 40) * 10, 2800)) + ' · y ' + fmt(k((p.y - 30) * 10, 2400)) + ' mm' });
      },
    };
  }
}
</script>
</body>
</html>
