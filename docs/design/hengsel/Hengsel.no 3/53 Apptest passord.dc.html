<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="icon" href="logo/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="logo/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="logo/apple-touch-icon-180.png">
  <meta name="theme-color" content="#5074A9">

  <title>Hengsel apptest</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="_ds/hengsel-design-system-5a9d09c6-be10-4ae1-a516-a0a32d786c17/tokens/colors.css">
  <link rel="stylesheet" href="_ds/hengsel-design-system-5a9d09c6-be10-4ae1-a516-a0a32d786c17/tokens/typography.css">
  <link rel="stylesheet" href="_ds/hengsel-design-system-5a9d09c6-be10-4ae1-a516-a0a32d786c17/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/hengsel-design-system-5a9d09c6-be10-4ae1-a516-a0a32d786c17/tokens/base.css">
  <link rel="stylesheet" href="_ds/hengsel-design-system-5a9d09c6-be10-4ae1-a516-a0a32d786c17/tokens/components.css">
  <script src="_ds/hengsel-design-system-5a9d09c6-be10-4ae1-a516-a0a32d786c17/_ds_bundle.js"></script>
  <style>
    @font-face { font-family: 'Reckless Standard M'; src: url('fonts/RecklessStandardM-Regular.woff2') format('woff2'); font-weight: 300 500; font-display: swap; }
    @font-face { font-family: 'TWK Lausanne'; src: url('fonts/TWKLausanne-350.woff2') format('woff2'); font-weight: 300 549; font-display: swap; }
    @font-face { font-family: 'TWK Lausanne'; src: url('fonts/TWKLausanne-650.woff2') format('woff2'); font-weight: 550 800; font-display: swap; }
    :root { --f-display: "Reckless Standard M", "Newsreader", Georgia, serif; --f-body: "TWK Lausanne", "Inter", system-ui, sans-serif; --w-body: 350; --w-strong: 650; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-weight: 350; }
    a { color: var(--accent); }
    a:hover { color: var(--accent); }
  </style>
</helmet>
<div data-theme="{{ theme }}" style="background:var(--bg); color:var(--ink); min-height:100vh; display:grid; grid-template-rows:auto 1fr auto">
  <header style="border-bottom:1px solid var(--line)">
    <div style="max-width:1180px; margin:0 auto; padding-inline:clamp(16px,4vw,40px); height:64px; display:flex; align-items:center">
      <a href="https://hengsel.no/" aria-label="Hengsel CRM – til hengsel.no" style="{{ logoWrap }}"><img src="{{ logoSrc }}" alt="Hengsel CRM" width="460" height="128" style="display:block; height:36px; width:auto"></a>
    </div>
  </header>
  <main style="display:grid; place-items:center; padding:clamp(32px,8vw,96px) clamp(16px,4vw,40px)">
    <form onSubmit="{{ submit }}" noValidate="{{ true }}" class="card" style="width:100%; max-width:440px; box-sizing:border-box; padding:clamp(24px,4vw,36px); border-radius:20px; display:grid; gap:18px">
      <div style="display:grid; gap:8px">
        <span class="eyebrow">Montørappen · testversjon</span>
        <h1 style="font-size:var(--t-h1); line-height:1.08">Hengsel apptest</h1>
        <p style="color:var(--muted)">Siden er for inviterte testere. Skriv inn passordet du har fått.</p>
      </div>
      <div class="field"><label for="pw">Passord</label><input class="input" id="pw" type="password" autoComplete="current-password" value="{{ pw }}" onChange="{{ onPw }}" aria-invalid="{{ invalid }}" style="min-height:48px"></div>
      <sc-if value="{{ feil }}" hint-placeholder-val="{{ false }}">
        <p role="alert" style="margin:0; padding:12px 14px; border-radius:10px; background:var(--surface-soft); box-shadow:inset 3px 0 0 var(--bad); font-weight:650">Feil passord. Prøv igjen.</p>
      </sc-if>
      <button class="btn primary" type="submit" style="min-height:48px">Gå videre</button>
    </form>
  </main>
  <footer style="border-top:1px solid var(--line); font-size:.9rem; color:var(--muted)">
    <div style="max-width:1180px; margin:0 auto; padding:24px clamp(16px,4vw,40px); display:flex; flex-wrap:wrap; gap:12px 28px; justify-content:space-between">
      <span>Hengsel · <a href="mailto:drift@sngroup.no" style="color:inherit">drift@sngroup.no</a></span>
      <a href="https://hengsel.no/" style="color:inherit">Til hengsel.no</a>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;tilstand&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;tom&quot;,&quot;feil&quot;],&quot;default&quot;:&quot;tom&quot;,&quot;tsType&quot;:&quot;'tom'|'feil'&quot;},&quot;tema&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;system&quot;,&quot;lys&quot;,&quot;mørk&quot;],&quot;default&quot;:&quot;system&quot;,&quot;tsType&quot;:&quot;'system'|'lys'|'mørk'&quot;}}">
class Component extends DCLogic {
  state = { sysDark: false, pw: '', feil: false };
  componentDidMount() {
    this.mq = matchMedia('(prefers-color-scheme: dark)');
    this.mqh = () => this.setState({ sysDark: this.mq.matches });
    this.mq.addEventListener('change', this.mqh); this.mqh();
    this.applyTheme();
  }
  componentDidUpdate() { this.applyTheme(); }
  componentWillUnmount() { this.mq && this.mq.removeEventListener('change', this.mqh); }
  isDark() { const t = this.props.tema ?? 'system'; return t === 'mørk' ? true : t === 'lys' ? false : this.state.sysDark; }
  applyTheme() { document.documentElement.setAttribute('data-theme', this.isDark() ? 'dark' : 'light'); }
  renderVals() {
    const feil = (this.props.tilstand ?? 'tom') === 'feil' || this.state.feil;
    return {
      theme: this.isDark() ? 'dark' : 'light',
      logoSrc: this.isDark() ? 'logo/hengsel-crm-logo-mork.svg' : 'logo/hengsel-crm-logo-lys.svg',
      logoWrap: { display: 'flex', alignItems: 'center' },
      pw: this.state.pw, feil, invalid: feil ? 'true' : 'false',
      onPw: (e) => this.setState({ pw: e.target.value, feil: false }),
      submit: (e) => { e.preventDefault(); this.setState({ feil: true }); },
    };
  }
}
</script>
</body>
</html>
