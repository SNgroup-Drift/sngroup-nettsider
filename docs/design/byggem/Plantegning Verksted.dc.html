<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/byggem-design-system-14638272-6b9d-48aa-bc6d-b50009fc57f9/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/byggem-design-system-14638272-6b9d-48aa-bc6d-b50009fc57f9/tokens/colors.css">
  <link rel="stylesheet" href="_ds/byggem-design-system-14638272-6b9d-48aa-bc6d-b50009fc57f9/tokens/typography.css">
  <script src="_ds/byggem-design-system-14638272-6b9d-48aa-bc6d-b50009fc57f9/_ds_bundle.js"></script>
</helmet>
<figure data-familiegrep="plantegningsstrek" style="margin: 0; color: var(--ink); width: 100%; font-family: var(--font-body)">
  <sc-if value="{{ verksted }}" hint-placeholder-val="{{ true }}">
    <div aria-hidden="true" style="display: flex; justify-content: space-between; gap: 12px; font-size: 12px; line-height: 16px; color: var(--ink-muted); font-variant-numeric: tabular-nums"><span>Verksted · 1:50</span><span>3 000 × 2 400 mm</span></div>
    <svg viewBox="246 248 200 166" role="img" aria-label="Plantegning av verkstedet, 3 000 × 2 400 mm" style="width: 100%; height: auto; display: block; margin-top: 6px">
      <path d="M270 396 H420 M270 392 V400 M420 392 V400 M434 260 V380 M430 260 H438 M430 380 H438" style="fill: none; stroke: var(--ink-muted); stroke-width: 0.8px; vector-effect: non-scaling-stroke"></path>
      <text x="345" y="407" style="fill: var(--ink-muted); font: 500 4.2px var(--font-body); text-anchor: middle">3 000</text>
      <text x="442" y="321" transform="rotate(90 442 320)" style="fill: var(--ink-muted); font: 500 4.2px var(--font-body); text-anchor: middle">2 400</text>
      <g style="fill: none; stroke: var(--ink); stroke-width: 1.5px; opacity: 0.6">
        <rect x="380" y="270" width="32" height="100" rx="1" style="vector-effect: non-scaling-stroke"></rect>
        <path d="M380 295 H412 M380 320 H412 M380 345 H412" style="vector-effect: non-scaling-stroke"></path>
        <rect x="284" y="350" width="60" height="20" rx="1" style="vector-effect: non-scaling-stroke"></rect>
      </g>
      <text x="286" y="300" style="fill: var(--ink); font: 500 4.2px var(--font-body); letter-spacing: 0.12em">VERKSTED</text>
      <path d="M300 232 V260 H420 M420 232 V300 M420 345 V380 M270 260 V380 M246 380 H446" style="fill: none; stroke: var(--ink); stroke-width: 1.5px; vector-effect: non-scaling-stroke"></path>
    </svg>
  </sc-if>
  <sc-if value="{{ tomt }}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="display: flex; justify-content: space-between; gap: 12px; font-size: 12px; line-height: 16px; color: var(--ink-muted); font-variant-numeric: tabular-nums"><span>Plantegning · 1:50</span><span>0 × 0 mm</span></div>
    <svg viewBox="0 0 200 140" role="img" aria-label="Et tomt rom som ikke finnes i tegningen" style="width: 100%; height: auto; display: block; margin-top: 6px">
      <rect x="30" y="24" width="140" height="92" style="fill: none; stroke: var(--line); stroke-width: 1.5px; stroke-dasharray: 6 5; vector-effect: non-scaling-stroke"></rect>
      <path d="M30 12 H170 M30 8 V16 M170 8 V16" style="fill: none; stroke: var(--ink-muted); stroke-width: 0.8px; vector-effect: non-scaling-stroke"></path>
      <text x="100" y="74" style="fill: var(--ink); font: 500 7px var(--font-body); letter-spacing: 0.12em; text-anchor: middle">404</text>
      <circle cx="30" cy="116" r="2" style="fill: var(--accent)"></circle>
    </svg>
  </sc-if>
</figure>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;460px&quot;,&quot;height&quot;:&quot;420px&quot;},&quot;mangler&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const mangler = !!this.props.mangler;
    return { verksted: !mangler, tomt: mangler };
  }
}
</script>
</body>
</html>
