<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/byggem-design-system-14638272-6b9d-48aa-bc6d-b50009fc57f9/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/byggem-design-system-14638272-6b9d-48aa-bc6d-b50009fc57f9/tokens/colors.css">
  <link rel="stylesheet" href="_ds/byggem-design-system-14638272-6b9d-48aa-bc6d-b50009fc57f9/tokens/typography.css">
  <link rel="stylesheet" href="_ds/byggem-design-system-14638272-6b9d-48aa-bc6d-b50009fc57f9/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/byggem-design-system-14638272-6b9d-48aa-bc6d-b50009fc57f9/tokens/base.css">
  <link rel="stylesheet" href="_ds/byggem-design-system-14638272-6b9d-48aa-bc6d-b50009fc57f9/components/components.css">
  <script src="_ds/byggem-design-system-14638272-6b9d-48aa-bc6d-b50009fc57f9/_ds_bundle.js"></script>
</helmet>
<header ref="{{ root }}" data-familiegrep="toppfelt" style="background: var(--surface); color: var(--ink); border-bottom: 1px solid var(--line); font-family: var(--font-body)">
  <div style="max-width: 1180px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); height: 80px; display: flex; align-items: center; gap: 24px">
    <a href="{{ hjem }}" aria-label="byggEM – forsiden" style="display: block; line-height: 0; flex: none">
      <sc-if value="{{ lys }}" hint-placeholder-val="{{ true }}"><img src="assets/logo-positiv.png" alt="byggEM" style="height: 32px; width: auto; display: block"></sc-if>
      <sc-if value="{{ mork }}" hint-placeholder-val="{{ false }}"><img src="assets/logo-negativ.png" alt="byggEM" style="height: 32px; width: auto; display: block"></sc-if>
    </a>
    <nav aria-label="Hovedmeny" style="margin-left: auto; display: flex; align-items: center; gap: {{ navGap }}">
      <sc-for list="{{ lenker }}" as="l" hint-placeholder-count="3">
        <a href="{{ l.href }}" aria-current="{{ l.current }}" style="font-size: 15px; line-height: 20px; font-weight: 500; color: {{ l.farge }}; text-decoration: {{ l.strek }}; text-underline-offset: 8px; padding-block: 12px" style-hover="color: var(--accent)">{{ l.label }}</a>
      </sc-for>
      <x-import component-from-global-scope="ByggEMDesignSystem_146382.Button" variant="primary" size="sm" href="{{ kontakt }}" aria-current="{{ kontaktCurrent }}" hint-size="104px,40px">Be om pris</x-import>
    </nav>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1200px&quot;,&quot;height&quot;:&quot;80px&quot;},&quot;hjem&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Forside.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;aktiv&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;prosjekter&quot;,&quot;kontakt&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;'' | 'prosjekter' | 'kontakt'&quot;},&quot;mork&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { w: 1440 };
  root = React.createRef();
  componentDidMount() {
    const el = this.root.current; if (!el) return;
    const m = () => { const w = el.clientWidth; if (w && w !== this.state.w) this.setState({ w }); };
    this.ro = new ResizeObserver(m); this.ro.observe(el); m();
  }
  componentWillUnmount() { this.ro && this.ro.disconnect(); }
  renderVals() {
    const hjem = this.props.hjem ?? 'Forside.dc.html';
    const aktiv = this.props.aktiv ?? '';
    const mork = !!this.props.mork;
    const bred = this.state.w > 860;
    const alle = [
      { id: 'tjenester', label: 'Tjenester', href: hjem + '#tjenester', bred: true },
      { id: 'slik', label: 'Slik jobber vi', href: hjem + '#slik-jobber-vi', bred: true },
      { id: 'prosjekter', label: 'Prosjekter', href: 'Prosjekter.dc.html', bred: false },
    ];
    const lenker = alle.filter((l) => bred || !l.bred).map((l) => ({
      ...l,
      current: aktiv === l.id ? 'page' : undefined,
      farge: aktiv === l.id ? 'var(--accent)' : 'var(--ink)',
      strek: aktiv === l.id ? 'underline' : 'none',
    }));
    return {
      root: this.root, hjem, lys: !mork, mork, lenker,
      navGap: bred ? '32px' : '20px',
      kontakt: 'Kontakt.dc.html',
      kontaktCurrent: aktiv === 'kontakt' ? 'page' : undefined,
    };
  }
}
</script>
</body>
</html>
