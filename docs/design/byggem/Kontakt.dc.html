<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>Kontakt byggEM | Be om pris</title>
  <meta name="description" content="Kontakt byggEM om montasje eller mindre snekkeroppdrag i Trondheim og omegn. Vi svarer innen én arbeidsdag.">
  <meta property="og:title" content="Kontakt byggEM | Be om pris">
  <meta property="og:description" content="Send oss informasjon om jobben, eller ring 976 06 500.">
  <meta property="og:image" content="assets/delingsbilde.png">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="_ds/byggem-design-system-14638272-6b9d-48aa-bc6d-b50009fc57f9/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/byggem-design-system-14638272-6b9d-48aa-bc6d-b50009fc57f9/tokens/colors.css">
  <link rel="stylesheet" href="_ds/byggem-design-system-14638272-6b9d-48aa-bc6d-b50009fc57f9/tokens/typography.css">
  <link rel="stylesheet" href="_ds/byggem-design-system-14638272-6b9d-48aa-bc6d-b50009fc57f9/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/byggem-design-system-14638272-6b9d-48aa-bc6d-b50009fc57f9/tokens/base.css">
  <link rel="stylesheet" href="_ds/byggem-design-system-14638272-6b9d-48aa-bc6d-b50009fc57f9/components/components.css">
  <link rel="stylesheet" href="_ds/byggem-design-system-14638272-6b9d-48aa-bc6d-b50009fc57f9/styles.css">
  <script src="_ds/byggem-design-system-14638272-6b9d-48aa-bc6d-b50009fc57f9/_ds_bundle.js"></script>
  <style>
    body { margin: 0; background: var(--surface); color: var(--ink); }
    a { color: var(--accent); }
    a:hover { color: var(--accent-hover); }
  </style>
</helmet>
<div ref="{{ root }}" data-theme="{{ theme }}" style="background: var(--surface); color: var(--ink); font-family: var(--font-body); min-height: 100vh">
  <dc-import name="Sidehode" hjem="Forside.dc.html" aktiv="kontakt" mork="{{ mork }}" style="position: sticky; top: 0; z-index: 40" hint-size="100%,81px"></dc-import>
  <main id="innhold">
    <section data-screen-label="Kontakt topp" style="border-bottom: 1px solid var(--line); padding-block: {{ py }}">
      <div style="max-width: 1180px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px)">
        <p style="margin: 0; font-size: 14px; line-height: 18px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted)">Kontakt</p>
        <h1 class="t-h1" style="margin: 20px 0 0; max-width: 20ch">Be om pris</h1>
        <p class="t-ingress" style="margin: 32px 0 0; max-width: 65ch">Fortell hva jobben gjelder. Vi svarer innen én arbeidsdag.</p>
        <p style="margin: 24px 0 0; font-size: 15px; line-height: 22px; color: var(--ink-muted)">976 06 500 · post@byggem.no · Trondheim og omegn</p>
      </div>
    </section>

    <section data-screen-label="Skjema" style="padding-block: {{ py }}">
      <div style="max-width: 1180px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); display: grid; grid-template-columns: {{ kol }}; gap: 48px">
        <form noValidate="{{ true }}" onSubmit="{{ send }}" style="display: flex; flex-direction: column; gap: 24px; min-width: 0">
          <div style="display: grid; grid-template-columns: {{ kol2 }}; gap: 24px">
            <x-import component-from-global-scope="ByggEMDesignSystem_146382.Field" label="Navn *" name="name" required="{{ true }}" max-length="100" auto-complete="name" error="{{ feil.name }}" hint-size="100%,80px"></x-import>
            <x-import component-from-global-scope="ByggEMDesignSystem_146382.Field" label="Firma" name="company" max-length="120" auto-complete="organization" hint-size="100%,80px"></x-import>
            <x-import component-from-global-scope="ByggEMDesignSystem_146382.Field" label="Telefon *" name="phone" type="tel" input-mode="tel" required="{{ true }}" auto-complete="tel" error="{{ feil.phone }}" hint-size="100%,80px"></x-import>
            <x-import component-from-global-scope="ByggEMDesignSystem_146382.Field" label="E-post *" name="email" type="email" required="{{ true }}" max-length="255" auto-complete="email" error="{{ feil.email }}" hint-size="100%,80px"></x-import>
          </div>
          <x-import component-from-global-scope="ByggEMDesignSystem_146382.Field" label="Hva gjelder det? *" name="subject" required="{{ true }}" options="{{ typer }}" error="{{ feil.subject }}" hint-size="100%,80px"></x-import>
          <x-import component-from-global-scope="ByggEMDesignSystem_146382.Field" label="Sted for jobben" name="location" max-length="150" auto-complete="address-level2" hint-size="100%,80px"></x-import>
          <x-import component-from-global-scope="ByggEMDesignSystem_146382.Field" label="Beskrivelse *" name="description" required="{{ true }}" multiline="{{ true }}" rows="7" max-length="3000" error="{{ feil.description }}" hint-size="100%,220px"></x-import>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label style="display: flex; gap: 12px; align-items: flex-start; font-size: 15px; line-height: 22px">
              <input type="checkbox" name="consent" style="width: 20px; height: 20px; margin: 1px 0 0; flex: none; accent-color: var(--accent)">
              <span>Jeg godtar at byggEM lagrer opplysningene for å svare på henvendelsen. Les <a href="Personvern.dc.html">personvernerklæringen</a>.</span>
            </label>
            <sc-if value="{{ feil.consent }}" hint-placeholder-val="{{ false }}">
              <span style="font-size: 14px; line-height: 20px; font-weight: 500; color: var(--danger)">{{ feil.consent }}</span>
            </sc-if>
          </div>
          <div>
            <x-import component-from-global-scope="ByggEMDesignSystem_146382.Button" variant="primary" type="submit" hint-size="180px,48px">Send henvendelse</x-import>
          </div>
        </form>
        <aside style="border-top: {{ asideTopp }}; border-left: {{ asideVenstre }}; padding: {{ asidePad }}">
          <h2 class="t-h3-display" style="margin: 0">Kontakt</h2>
          <p style="margin: 20px 0 0"><a href="tel:+4797606500">976 06 500</a><br><a href="mailto:post@byggem.no">post@byggem.no</a></p>
          <p style="margin: 32px 0 0">Vi jobber i Trondheim og omegn.</p>
        </aside>
      </div>
    </section>
  </main>
  <dc-import name="Bunn" hint-size="100%,300px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;tema&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;system&quot;,&quot;lys&quot;,&quot;mørk&quot;],&quot;default&quot;:&quot;system&quot;,&quot;tsType&quot;:&quot;'system' | 'lys' | 'mørk'&quot;}}">
class Component extends DCLogic {
  state = { w: 1440, sysDark: false, feil: {} };
  root = React.createRef();
  componentDidMount() {
    const el = this.root.current;
    if (el) { const m = () => { const w = el.clientWidth; if (w && w !== this.state.w) this.setState({ w }); }; this.ro = new ResizeObserver(m); this.ro.observe(el); m(); }
    this.mq = matchMedia('(prefers-color-scheme: dark)');
    this.mqh = () => this.setState({ sysDark: this.mq.matches });
    this.mq.addEventListener('change', this.mqh); this.mqh();
  }
  componentDidUpdate() { document.documentElement.setAttribute('data-theme', this.isDark() ? 'dark' : 'light'); }
  componentWillUnmount() { this.ro && this.ro.disconnect(); this.mq && this.mq.removeEventListener('change', this.mqh); }
  isDark() {
    const q = new URLSearchParams(location.search).get('tema');
    const t = q === 'mork' || q === 'mørk' ? 'mørk' : q === 'lys' ? 'lys' : (this.props.tema ?? 'system');
    return t === 'mørk' ? true : t === 'lys' ? false : this.state.sysDark;
  }
  send = (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const v = (k) => String(f.get(k) || '').trim();
    const feil = {};
    if (!v('name')) feil.name = 'Skriv navnet ditt.';
    if (!v('phone')) feil.phone = 'Skriv et telefonnummer vi kan ringe.';
    if (!v('email').includes('@')) feil.email = 'Skriv en gyldig e-postadresse.';
    if (!v('subject') || v('subject') === 'Velg type oppdrag') feil.subject = 'Velg hva det gjelder.';
    if (!v('description')) feil.description = 'Skriv kort hva jobben gjelder.';
    if (!f.get('consent')) feil.consent = 'Kryss av for å sende.';
    this.setState({ feil });
    if (Object.keys(feil).length) return;
    const linjer = [
      'Navn: ' + v('name'), v('company') ? 'Firma: ' + v('company') : '', 'Telefon: ' + v('phone'), 'E-post: ' + v('email'),
      'Gjelder: ' + v('subject'), v('location') ? 'Sted: ' + v('location') : '', '', v('description'),
    ].filter((l, i) => l !== '' || i === 6);
    location.href = 'mailto:post@byggem.no?subject=' + encodeURIComponent('Be om pris – ' + v('subject')) + '&body=' + encodeURIComponent(linjer.join('\n'));
  };
  renderVals() {
    const w = this.state.w;
    const mob = w < 860;
    const smal = w < 1024;
    const mork = this.isDark();
    return {
      root: this.root, theme: mork ? 'dark' : 'light', mork,
      py: mob ? '64px' : '96px',
      kol: smal ? 'minmax(0,1fr)' : 'minmax(0,2fr) minmax(0,1fr)',
      kol2: mob ? 'minmax(0,1fr)' : 'repeat(2, minmax(0,1fr))',
      asideTopp: smal ? '1px solid var(--line)' : '0',
      asideVenstre: smal ? '0' : '1px solid var(--line)',
      asidePad: smal ? '32px 0 0' : '0 0 0 32px',
      typer: ['Velg type oppdrag', 'Montering av kjøkken', 'Bad eller garderobe', 'Innredning og kontor', 'Leie av montører', 'Mindre snekkeroppdrag', 'Annet'],
      feil: this.state.feil,
      send: this.send,
    };
  }
}
</script>
</body>
</html>
